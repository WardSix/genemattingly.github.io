<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gene Mattingly</title>
    <meta name="description" content="Gene Mattingly">
    <meta name="author" content="Gene Mattingly">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://genemattingly.com/">
    <link rel="icon" type="image/png" href="images/gmlogoregular.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="studio-lights" aria-hidden="true">
        <span class="studio-light studio-light--left"></span>
        <span class="studio-light studio-light--right"></span>
    </div>

    <main class="stage" aria-label="Video stage">
        <div class="video-mount">
            <video
                class="stage-video"
                autoplay
                muted
                playsinline
                preload="auto"
                aria-label="Gene Mattingly logo animation"
            >
                <source src="video/gmlogovideo.mp4" type="video/mp4">
            </video>
        </div>
    </main>
</body>
</html>
